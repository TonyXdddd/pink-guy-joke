<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIDEO 1, VIDEO 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #000;
      --paper: #fff;
      --paint-grey: #818081; /* серое поле вокруг холста Paint со скриншота */
      --hand: 'Amatic SC', 'Comic Sans MS', 'Segoe Print', cursive;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--paint-grey);
      color: var(--ink);
      font-family: var(--hand);
      overflow-x: hidden;
    }

    @media (max-width: 640px) {
      body { place-items: start center; background: var(--paper); }
    }

    /* Холст 621×875 — размер исходного рисунка. Всё ниже позиционируется
       в его пикселях через --x/--y/--w/--h, чтобы совпадать с картинкой. */
    .sheet {
      position: relative;
      width: min(100vw, 621px, calc(100svh * 621 / 875));
      aspect-ratio: 621 / 875;
      background: var(--paper);
      overflow: hidden;
      container-type: inline-size;
    }

    .at {
      position: absolute;
      left: calc(var(--x) / 621 * 100%);
      top: calc(var(--y) / 875 * 100%);
      width: calc(var(--w) / 621 * 100%);
      height: calc(var(--h) / 875 * 100%);
    }

    .layer {
      position: absolute;
      inset: 0;
      background: 0 0 / 100% 100% no-repeat;
      pointer-events: none;
    }

    .lines { z-index: 2; background-image: var(--lines); }

    /* --- Видосы в нарисованных "блобах" --- */

    .blob {
      z-index: 1;
      cursor: pointer;
      -webkit-mask: var(--mask) 0 0 / 100% 100% no-repeat;
      mask: var(--mask) 0 0 / 100% 100% no-repeat;
    }

    /* Плеер 16:9 по ширине блоба: он чуть выше блоба, лишнее срезает маска.
       Клики забирает сам блоб, плеером управляем через postMessage. */
    .blob iframe {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      background: var(--ink);
      opacity: 0;
      transform: translateY(-50%);
      transition: opacity 0.4s;
      pointer-events: none;
    }

    .blob iframe:fullscreen { pointer-events: auto; }

    .blob .scribbles {
      background-image: var(--scribbles);
      transition: opacity 0.4s;
    }

    .blob.is-on iframe { opacity: 1; }
    .blob.is-on .scribbles { opacity: 0; }

    /* Пока грузится — каракули нервно дёргаются */
    .blob.is-loading .scribbles { animation: jitter 0.2s steps(2) infinite; }

    @keyframes jitter {
      0% { transform: translate(0, 0); }
      50% { transform: translate(1.5px, -1px) rotate(0.4deg); }
      100% { transform: translate(-1px, 1px) rotate(-0.3deg); }
    }

    /* --- Невидимые кнопки поверх нарисованного --- */

    .hot {
      z-index: 3;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .hot:focus-visible,
    .menu button:focus-visible {
      outline: 3px dashed var(--ink);
      outline-offset: 2px;
    }

    /* --- Нарисованная от руки рамка --- */

    .sketchy::before {
      content: '';
      position: absolute;
      inset: var(--frame-inset, 0);
      border: 3px solid var(--ink);
      border-radius: 18px 255px 15px 225px / 225px 15px 255px 15px;
      filter: url(#wobble);
      pointer-events: none;
    }

    /* --- Бургер-меню --- */

    .backdrop {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: rgb(0 0 0 / 0.15);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .menu {
      --frame-inset: -12px 0 -12px -12px;
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 5;
      width: 72%;
      display: flex;
      flex-direction: column;
      padding: 4cqw 6cqw;
      background: var(--paper);
      transform: translateX(-105%);
      transition: transform 0.35s cubic-bezier(0.3, 1.4, 0.5, 1);
    }

    .sheet.menu-open .menu { transform: none; }
    .sheet.menu-open .backdrop { opacity: 1; visibility: visible; }

    .menu-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 9cqw;
    }

    .menu ul {
      margin: 4cqw 0 0;
      padding: 0;
      list-style: none;
    }

    .menu button {
      padding: 1cqw 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      font-size: 7cqw;
      line-height: 1.1;
      text-align: left;
      cursor: pointer;
    }

    .menu button:hover {
      text-decoration: underline wavy;
      text-underline-offset: 0.15em;
    }

    .menu .menu-close { font-size: 11cqw; line-height: 1; }

    .menu s { text-decoration-thickness: 3px; }

    .menu-foot {
      margin-top: auto;
      font-size: 4.5cqw;
    }

    .wobbly-text { filter: url(#wobble-text); }

    /* --- Пузырь с сообщениями --- */

    .bubble {
      --frame-inset: 0;
      position: absolute;
      left: 50%;
      bottom: 8%;
      z-index: 6;
      max-width: 82%;
      width: max-content;
      padding: 3cqw 5cqw;
      background: var(--paper);
      font-size: 6cqw;
      line-height: 1.15;
      text-align: center;
      white-space: pre-line;
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) rotate(-1.5deg) scale(0.9);
      transition: opacity 0.2s, visibility 0.2s, transform 0.2s;
    }

    .bubble[data-place='top'] {
      left: auto;
      right: 3%;
      bottom: auto;
      top: 7%;
      transform: rotate(1.5deg) scale(0.9);
      transform-origin: top right;
    }

    .bubble.is-shown { opacity: 1; visibility: visible; transform: translateX(-50%) rotate(-1.5deg); }
    .bubble[data-place='top'].is-shown { transform: rotate(1.5deg); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { transition: none !important; animation: none !important; }
    }
  </style>

<body>
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" />

    <filter id="wobble-text">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="1" seed="2" />
      <feDisplacementMap in="SourceGraphic" scale="2.5" />

  </svg>

  <main class="sheet">
    <div class="blob at" id="v1" data-broken style="--x: 120; --y: 130; --w: 501; --h: 239" title="Тык — смотреть, двойной тык — на весь экран">
      <div class="layer scribbles"></div>
    </div>

    <div class="blob at" id="v2" data-youtube="EtxBvU21J28" style="--x: 0; --y: 495; --w: 459; --h: 248" title="Тык — смотреть, двойной тык — на весь экран">
      <div class="layer scribbles"></div>
    </div>

    <div class="layer lines" role="img" aria-label="Рисунок в Paint: меню, профиль и два видео"></div>

    <button class="hot at" style="--x: 4; --y: 0; --w: 76; --h: 50" data-action="menu" aria-label="Меню" aria-expanded="false" aria-controls="menu"></button>
    <button class="hot at" style="--x: 528; --y: 0; --w: 93; --h: 50" data-action="profile" aria-label="Профиль"></button>
    <button class="hot at" style="--x: 104; --y: 364; --w: 366; --h: 112" data-action="toggle" data-video="0" aria-label="VIDEO 1: смотреть или пауза"></button>
    <button class="hot at" style="--x: 254; --y: 768; --w: 308; --h: 75" data-action="toggle" data-video="1" aria-label="VIDEO 2: смотреть или пауза"></button>

    <div class="backdrop" data-action="close-menu"></div>

    <nav class="menu sketchy" id="menu" aria-label="Меню" inert>
      <div class="menu-head wobbly-text">
        <span>МЕНЮ</span>
        <button class="menu-close" data-action="close-menu" aria-label="Закрыть меню">×</button>
      </div>
      <ul class="wobbly-text">
        <li><button data-action="play" data-video="0">VIDEO 1</button></li>
        <li><button data-action="play" data-video="1">VIDEO 2</button></li>
        <li><button data-action="say" data-say="Других видосов нет.&#10;Есть только Pink Guy.">Другой рандомный видос</button></li>
        <li><button data-action="say" data-say="VIDEO 3 не нарисовано.&#10;Мышка устала."><s>VIDEO 3</s></button></li>
        <li><button data-action="say" data-say="Настройки:&#10;кисть 3px, цвет чёрный. Всё.">Настройки</button></li>
        <li><button data-action="say" data-say="Дизайн: Paint, 2 минуты.&#10;Вёрстка: пиксель в пиксель.">О нас</button></li>
      </ul>
      <p class="menu-foot wobbly-text">© 2026 · все права нарисованы</p>
    </nav>

    <div class="bubble sketchy wobbly-text" role="status" aria-live="polite"></div>
  </main>

  <script>
    const YOUTUBE = 'https://www.youtube.com';

    const PROFILE_TEXT = 'Профиль: аноним с мышкой.\n(Это голова в кепке или глаз —\nавтор сам уже не помнит.)';

    // VIDEO 1 нарочно никогда не грузится: делает вид и выдаёт шутки по кругу.
    const BROKEN_JOKES = [
      'Загрузка 99%…\nОсталось примерно всегда.',
      'VIDEO 1 не загрузился.\nИнтернет ушёл за хлебом.',
      'Ошибка 418:\nя чайник, а не видеоплеер.',
      'VIDEO 1 стесняется.\nОтвернитесь и тыкните ещё раз.',
      'VIDEO 1 доступен в Premium.\nPremium не нарисован.',
      'Ладно, честно: VIDEO 1 не будет.\nСмотрите VIDEO 2.',
    ];

    const sheet = document.querySelector('.sheet');
    const menu = document.getElementById('menu');
    const burger = document.querySelector('[data-action="menu"]');
    const bubble = document.querySelector('.bubble');
    const blobs = [...document.querySelectorAll('.blob')];

    // --- Пузырь ---

    let bubbleTimer;

    function say(text, place = 'bottom') {
      bubble.textContent = text;
      bubble.dataset.place = place;
      bubble.classList.add('is-shown');
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(hideBubble, 3500);
    }

    function hideBubble() {
      bubble.classList.remove('is-shown');
    }

    // --- Видосы ---

    let brokenClicks = 0;

    // Каракули дёргаются, будто грузится, а потом — очередная шутка.
    function fakeLoad(blob) {
      if (blob.classList.contains('is-loading')) {
        return;
      }

      blob.classList.add('is-loading');

      setTimeout(() => {
        blob.classList.remove('is-loading');
        say(BROKEN_JOKES[brokenClicks % BROKEN_JOKES.length]);
        brokenClicks += 1;
      }, 1500 + Math.random() * 1000);
    }

    // Команды плееру YouTube через postMessage, без подключения iframe_api.
    function sendToPlayer(blob, message) {
      blob.querySelector('iframe').contentWindow.postMessage(JSON.stringify(message), YOUTUBE);
    }

    function mountPlayer(blob) {
      const id = blob.dataset.youtube;
      const params = new URLSearchParams({
        autoplay: 1,
        controls: 0,
        playsinline: 1,
        rel: 0,
        enablejsapi: 1,
        // loop у одиночного ролика работает только вместе с playlist
        loop: 1,
        playlist: id,
        origin: location.origin,
      });

      const iframe = document.createElement('iframe');

      iframe.src = `${YOUTUBE}/embed/${id}?${params}`;
      iframe.title = 'habe u seen alien';
      iframe.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
      iframe.referrerPolicy = 'strict-origin-when-cross-origin';

      // Подписываемся на события плеера, чтобы знать, играет ли он.
      iframe.addEventListener('load', () => {
        sendToPlayer(blob, { event: 'listening', id: blob.id, channel: 'widget' });
      });

      blob.classList.add('is-loading');
      blob.prepend(iframe);
    }

    // Страницам с диска (file://) YouTube плеер не отдаёт — ошибка 153.
    // Поэтому отправляем смотреть к ним.
    function openOnYoutube(blob) {
      say('С диска YouTube видос не покажет.\nОткрываю у них, не благодарите.');
      window.open(`${YOUTUBE}/watch?v=${blob.dataset.youtube}`, '_blank', 'noopener');
    }

    function play(blob) {
      if ('broken' in blob.dataset) {
        fakeLoad(blob);
      } else if (!location.protocol.startsWith('http')) {
        openOnYoutube(blob);
      } else if (!blob.querySelector('iframe')) {
        mountPlayer(blob);
      } else {
        sendToPlayer(blob, { event: 'command', func: 'playVideo', args: [] });
      }
    }

    function toggle(blob) {
      if (blob.dataset.state === 'playing') {
        sendToPlayer(blob, { event: 'command', func: 'pauseVideo', args: [] });
      } else {
        play(blob);
      }
    }

    // Состояния плеера YouTube: 1 — играет, 2 — пауза, 3 — буферизация.
    window.addEventListener('message', (event) => {
      if (event.origin !== YOUTUBE) {
        return;
      }

      const blob = blobs.find((other) => other.querySelector('iframe')?.contentWindow === event.source);
      let data;

      try {
        data = JSON.parse(event.data);
      } catch {
        return;
      }

      const state = data.event === 'onStateChange' ? data.info : data.info?.playerState;

      if (!blob || typeof state !== 'number') {
        return;
      }

      blob.dataset.state = state === 1 ? 'playing' : 'stopped';
      blob.classList.toggle('is-loading', state === 3);

      if (state === 1) {
        blob.classList.add('is-on');
      }
    });

    for (const blob of blobs) {
      blob.addEventListener('click', () => toggle(blob));

      // Два клика уже поставили паузу и сняли её, так что просто разворачиваем.
      blob.addEventListener('dblclick', () => {
        const iframe = blob.querySelector('iframe');

        if (iframe) {
          play(blob);
          iframe.requestFullscreen?.().catch(() => {});
        }
      });
    }

    // --- Меню и кнопки ---

    function setMenu(open) {
      sheet.classList.toggle('menu-open', open);
      burger.setAttribute('aria-expanded', String(open));
      menu.inert = !open;

      if (open) {
        menu.querySelector('ul button').focus({ preventScroll: true });
      } else if (menu.contains(document.activeElement)) {
        burger.focus({ preventScroll: true });
      }
    }

    const ACTIONS = {
      menu: () => setMenu(!sheet.classList.contains('menu-open')),
      'close-menu': () => setMenu(false),
      toggle: (el) => toggle(blobs[el.dataset.video]),
      play: (el) => {
        setMenu(false);
        play(blobs[el.dataset.video]);
      },
      profile: () => say(PROFILE_TEXT, 'top'),
      say: (el) => say(el.dataset.say),
    };

    document.addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');

      if (el) {
        ACTIONS[el.dataset.action](el);
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        setMenu(false);
        hideBubble();
      }
    });
  </script>
